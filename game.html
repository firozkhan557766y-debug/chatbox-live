<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatBox - Play Zone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7fb;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ऊपर का हेडर */
    .top-bar {
      background: linear-gradient(135deg, #1DE9B6 0%, #2979FF 100%);
      color: white;
      padding: 20px;
      
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .header-title {
      font-size: 21px;
      font-weight: bold;
    }

    .container {
      padding: 25px 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* स्कोर कार्ड */
    .score-board {
      width: 100%;
      max-width: 340px;
      background: white;
      border-radius: 20px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .score-item {
      text-align: center;
    }

    .score-item span {
      display: block;
      font-size: 12px;
      color: #64748b;
      font-weight: bold;
    }

    .score-item strong {
      font-size: 24px;
      color: #2979FF;
    }

    .status-banner {
      font-size: 18px;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 20px;
      background: #e0f2fe;
      padding: 10px 22px;
      border-radius: 16px;
    }

    /* गेम बोर्ड */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 25px;
    }

    .cell {
      aspect-ratio: 1 / 1;
      background: white;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 42px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
      transition: transform 0.15s;
    }

    .cell:active {
      transform: scale(0.93);
    }

    .cell.x {
      color: #2979FF;
    }

    .cell.o {
      color: #10b981;
    }

    .reset-btn {
      width: 100%;
      max-width: 320px;
      padding: 15px;
      background: linear-gradient(135deg, #1DE9B6 0%, #2979FF 100%);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(41, 121, 255, 0.25);
    }
  </style>
</head>
<body>

  <!-- हेडर -->
  <div class="top-bar">
    <div class="header-left">
      <a href="third.html" style="width: 38px; height: 38px; border-radius: 12px; background: rgba(255, 255, 255, 0.22); display: inline-flex; justify-content: center; align-items: center; margin-right: 12px; text-decoration: none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <div class="header-title">🎮 Chat & Play</div>
    </div>
    <span style="font-size: 12px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px;">vs AI</span>
  </div>

  <div class="container">
    <!-- स्कोर बोर्ड -->
    <div class="score-board">
      <div class="score-item">
        <span>YOU (X)</span>
        <strong id="youScore">0</strong>
      </div>
      <div class="score-item">
        <span>AI BOT (O)</span>
        <strong id="aiScore" style="color: #10b981;">0</strong>
      </div>
    </div>

    <div class="status-banner" id="gameStatus">Your Turn (X)</div>
  
    <!-- 9 खानों वाला गेम बोर्ड -->
    <div class="board" id="gameBoard">
      <div class="cell" onclick="makeMove(0)"></div>
      <div class="cell" onclick="makeMove(1)"></div>
      <div class="cell" onclick="makeMove(2)"></div>
      <div class="cell" onclick="makeMove(3)"></div>
      <div class="cell" onclick="makeMove(4)"></div>
      <div class="cell" onclick="makeMove(5)"></div>
      <div class="cell" onclick="makeMove(6)"></div>
      <div class="cell" onclick="makeMove(7)"></div>
      <div class="cell" onclick="makeMove(8)"></div>
          
    </div>

    <button class="reset-btn" onclick="resetGame()">🔄 Play Again</button>
  </div>

  <script>
    let board = ["", "", "", "", "", "", "", "", ""];
    let gameActive = true;
    let youWins = 0;
    let aiWins = 0;

        const winConditions = [, [3, 4, 5], [6, 7, 8],
, [1, 4, 7], [2, 5, 8],
, [2, 4, 6]
    ];

    
    function makeMove(index) {
      if (board[index] !== "" || !gameActive) return;

      // यूजर की चाल (X)
      board[index] = "X";
      updateBoard();

      if (checkWinner("X")) {
        document.getElementById("gameStatus").innerText = "🎉 You Won!";
        youWins++;
        document.getElementById("youScore").innerText = youWins;
        gameActive = false;
        return;
      }

      if (!board.includes("")) {
        document.getElementById("gameStatus").innerText = "🤝 Match Draw!";
        gameActive = false;
        return;
      }

      // AI बॉट की चाल (O)
      document.getElementById("gameStatus").innerText = "AI is thinking...";
      setTimeout(() => {
        if (!gameActive) return;
        let emptyCells = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
        if (emptyCells.length > 0) {
          let randomIdx = emptyCells[Math.floor(Math.random() * emptyCells.length)];
          board[randomIdx] = "O";
          updateBoard();

          if (checkWinner("O")) {
            document.getElementById("gameStatus").innerText = "🤖 AI Won!";
            aiWins++;
            document.getElementById("aiScore").innerText = aiWins;
            gameActive = false;
          } else if (!board.includes("")) {
            document.getElementById("gameStatus").innerText = "🤝 Match Draw!";
            gameActive = false;
          } else {
            document.getElementById("gameStatus").innerText = "Your Turn (X)";
          }
        }
      }, 450);
    }

    function updateBoard() {
      const cells = document.querySelectorAll(".cell");
      cells.forEach((cell, i) => {
        cell.innerText = board[i];
        cell.className = "cell " + board[i].toLowerCase();
      });
    }

    function checkWinner(player) {
      return winConditions.some(combo => {
        return combo.every(index => board[index] === player);
      });
    }

    function resetGame() {
      board = ["", "", "", "", "", "", "", "", ""];
      gameActive = true;
      document.getElementById("gameStatus").innerText = "Your Turn (X)";
      updateBoard();
    }
  </script>
  <script src="theme.js"></script>
   <script src="no_tap.js"></script>
   <script src="app_global.js"></script>

</body>
</html>
