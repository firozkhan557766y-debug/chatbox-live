<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatBox - Media & Storage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7fb;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ऊपर का हेडर */
    .top-bar {
      background: linear-gradient(135deg, #1DE9B6 0%, #2979FF 100%);
      color: white;
      padding: 20px;
      
      display: flex;
      align-items: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 24px;
      font-weight: bold;
      margin-right: 15px;
    }

    .header-title {
      font-size: 21px;
      font-weight: bold;
    }

    .container {
      padding: 20px 15px;
      flex: 1;
    }

    /* स्टोरेज मीटर कार्ड */
    .storage-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .storage-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .storage-top h3 {
      font-size: 16px;
    }

    .storage-size {
      font-size: 14px;
      font-weight: bold;
      color: #2979FF;
    }

    .bar-bg {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .bar-fill {
      width: 35%;
      height: 100%;
      background: linear-gradient(90deg, #1DE9B6, #2979FF);
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .clean-btn {
      width: 100%;
      padding: 12px;
      background: #eff6ff;
      color: #2979FF;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* मीडिया टैब्स */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: none;
      background: white;
      color: #64748b;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #2979FF;
      color: white;
    }

    /* फोटो ग्रिड */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .media-box {
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .media-box span {
      font-size: 10px;
      margin-top: 5px;
      opacity: 0.9;
    }

    /* डॉक्यूमेंट लिस्ट */
    .docs-list {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .doc-item {
      background: white;
      padding: 14px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
  </style>
</head>
<body>

  <!-- हेडर -->
  <div class="top-bar">
<a href="setting.html" style="width: 38px; height: 38px; border-radius: 12px; background: rgba(255, 255, 255, 0.22); display: inline-flex; justify-content: center; align-items: center; margin-right: 12px; text-decoration: none;">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 18l-6-6 6-6"/>
  </svg>
</a>

    <div class="header-title">📁 Media & Storage</div>
  </div>

  <div class="container">
    <!-- स्टोरेज कार्ड -->
    <div class="storage-card">
      <div class="storage-top">
        <h3>ChatBox Storage Used</h3>
        <span class="storage-size" id="storageText">18.4 MB</span>
      </div>
      <div class="bar-bg">
        <div class="bar-fill" id="storageBar"></div>
      </div>
      <button class="clean-btn" onclick="cleanCache()">🧹 Clean Junk & Cache</button>
    </div>

    <!-- टैब्स -->
    <div class="tabs">
      <button class="tab-btn active" id="btnPhotos" onclick="switchMedia('photos')">🖼️ Shared Photos</button>
      <button class="tab-btn" id="btnDocs" onclick="switchMedia('docs')">📄 Documents</button>
    </div>

    <!-- फोटो ग्रिड -->
    <div class="media-grid" id="photosSection">
      <div class="media-box" style="background: linear-gradient(135deg, #2979FF, #1DE9B6);">🏔️<span>Trip.jpg</span></div>
      <div class="media-box" style="background: linear-gradient(135deg, #8E2DE2, #FF4081);">🎨<span>Design.png</span></div>
      <div class="media-box" style="background: linear-gradient(135deg, #11998e, #38ef7d);">📸<span>Selfie.jpg</span></div>
      <div class="media-box" style="background: linear-gradient(135deg, #F59E0B, #EF4444);">🌅<span>Sunset.jpg</span></div>
      <div class="media-box" style="background: linear-gradient(135deg, #3B82F6, #1D4ED8);">💻<span>Code.png</span></div>
      <div class="media-box" style="background: linear-gradient(135deg, #EC4899, #8B5CF6);">🎉<span>Party.jpg</span></div>
    </div>

    <!-- डॉक्यूमेंट लिस्ट -->
    <div class="docs-list" id="docsSection">
      <div class="doc-item">
        <div>
          <strong style="font-size: 14px;">📄 Project_Notes.pdf</strong>
          <div style="font-size: 11px; color: #64748b;">2.4 MB • Shared by Aarav</div>
        </div>
        <span style="color: #2979FF; font-weight: bold; font-size: 12px;">HD</span>
      </div>
      <div class="doc-item">
        <div>
          <strong style="font-size: 14px;">📊 ChatBox_Plan.docx</strong>
          <div style="font-size: 11px; color: #64748b;">1.1 MB • Shared by Priya</div>
        </div>
        <span style="color: #2979FF; font-weight: bold; font-size: 12px;">HD</span>
      </div>
    </div>
  </div>

  <script>
    function switchMedia(type) {
      if (type === "photos") {
        document.getElementById("photosSection").style.display = "grid";
        document.getElementById("docsSection").style.display = "none";
        document.getElementById("btnPhotos").classList.add("active");
        document.getElementById("btnDocs").classList.remove("active");
      } else {
        document.getElementById("photosSection").style.display = "none";
        document.getElementById("docsSection").style.display = "flex";
        document.getElementById("btnDocs").classList.add("active");
        document.getElementById("btnPhotos").classList.remove("active");
      }
    }

    function cleanCache() {
      document.getElementById("storageBar").style.width = "10%";
      document.getElementById("storageText").innerText = "4.2 MB (Optimized)";
      alert("Cache cleaned! 14.2 MB space freed up.");
    }
  </script>
  <script src="arrow.js"></script>
  <script src="theme.js"></script>
   <script src="no_tap.js"></script>
   <script src="app_global.js"></script>

</body>

</html>
