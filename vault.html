<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatBox - Secret Vault</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ऊपर का डार्क प्रीमियम हेडर */
    .top-bar {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      padding: 20px;
      
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .back-btn {
      color: #38bdf8;
      text-decoration: none;
      font-size: 24px;
      font-weight: bold;
      margin-right: 15px;
    }

    .header-title {
      font-size: 21px;
      font-weight: bold;
    }

    /* लॉक स्क्रीन ओवरले */
    .lock-overlay {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }

    .lock-icon {
      width: 80px;
      height: 80px;
      border-radius: 25px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .pin-input {
      background: #1e293b;
      border: 2px solid #334155;
      color: white;
      font-size: 24px;
      letter-spacing: 8px;
      text-align: center;
      width: 180px;
      padding: 12px;
      border-radius: 16px;
      margin: 20px 0;
      outline: none;
    }

    .pin-input:focus {
      border-color: #38bdf8;
    }

    .unlock-btn {
      background: linear-gradient(135deg, #1DE9B6 0%, #2979FF 100%);
      color: white;
      border: none;
      padding: 14px 35px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* वॉल्ट के अंदर का हिस्सा */
    .vault-content {
      display: none;
      padding: 20px 15px;
      flex: 1;
    }

    .note-box {
      background: #1e293b;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      outline: none;
      resize: none;
      margin-bottom: 12px;
    }

    .save-note-btn {
      width: 100%;
      padding: 12px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .saved-item {
      background: #1e293b;
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #1DE9B6;
    }

    .del-btn {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- हेडर -->
  <div class="top-bar">
    <div class="header-left">
      <a href="setting.html" style="width: 38px; height: 38px; border-radius: 12px; background: rgba(255, 255, 255, 0.22); display: inline-flex; justify-content: center; align-items: center; margin-right: 12px; text-decoration: none;">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 18l-6-6 6-6"/>
  </svg>
</a>

      <div class="header-title">🔐 Secret Vault</div>
    </div>
    <span style="font-size: 12px; color: #1DE9B6;">Encrypted</span>
  </div>

  <!-- 1. पिन लॉक स्क्रीन -->
  <div class="lock-overlay" id="lockScreen">
    <div class="lock-icon">🛡️</div>
    <h2>Enter Vault PIN</h2>
    <p style="font-size: 13px; color: #94a3b8; margin-top: 6px;">Use your ChatBox PIN (Default: 1234)</p>
    <input type="password" id="vaultPin" class="pin-input" maxlength="4" placeholder="••••">
    <button class="unlock-btn" onclick="unlockVault()">Unlock Vault</button>
  </div>

  <!-- 2. वॉल्ट के अंदर का सीक्रेट डेटा -->
  <div class="vault-content" id="vaultContent">
    <div class="note-box">
      <h4 style="margin-bottom: 10px; color: #38bdf8;">+ Add Secret Note or Password</h4>
      <textarea id="secretInput" rows="3" placeholder="Write private note, PIN, or secret message..."></textarea>
      <button class="save-note-btn" onclick="addSecretNote()">Lock & Save in Vault</button>
    </div>

    <div style="font-size: 13px; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase;">Saved Secrets</div>
    <div id="secretsList"></div>
  </div>

  <script>
    // वॉल्ट अनलॉक करना
    function unlockVault() {
      const entered = document.getElementById("vaultPin").value;
      const savedPin = localStorage.getItem("chatbox_pin") || "1234";

      if (entered === savedPin) {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("vaultContent").style.display = "block";
        loadSecrets();
      } else {
        alert("Wrong PIN! Try again.");
        document.getElementById("vaultPin").value = "";
      }
    }

    // सीक्रेट नोट सेव करना
    function addSecretNote() {
      const text = document.getElementById("secretInput").value.trim();
      if (text === "") return;

      let secrets = JSON.parse(localStorage.getItem("chatbox_vault") || "[]");
      secrets.push(text);
      localStorage.setItem("chatbox_vault", JSON.stringify(secrets));

      document.getElementById("secretInput").value = "";
      loadSecrets();
    }

    // सेव किए गए नोट्स दिखाना
    function loadSecrets() {
      const list = document.getElementById("secretsList");
      const secrets = JSON.parse(localStorage.getItem("chatbox_vault") || "[]");
      list.innerHTML = "";

      if (secrets.length === 0) {
        list.innerHTML = "<p style='color:#64748b; font-size:14px;'>No secret notes saved yet.</p>";
        return;
      }

      secrets.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "saved-item";
        div.innerHTML = `
          <span style="font-size: 14px; word-break: break-word; padding-right: 10px;">${item}</span>
          <button class="del-btn" onclick="deleteSecret(${index})">Delete</button>
        `;
        list.appendChild(div);
      });
    }

    // नोट डिलीट करना
    function deleteSecret(index) {
      let secrets = JSON.parse(localStorage.getItem("chatbox_vault") || "[]");
      secrets.splice(index, 1);
      localStorage.setItem("chatbox_vault", JSON.stringify(secrets));
      loadSecrets();
    }
  </script>
 <script src="theme.js"></script>
  <script src="no_tap.js"></script>
  <script src="app_global.js"></script>

</body>
</html>
